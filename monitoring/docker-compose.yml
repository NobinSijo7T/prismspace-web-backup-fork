services:
  alloy:
    build: .
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
      RENDER_METRICS_HOST: ${RENDER_METRICS_HOST:-render.example.invalid:443}
      RENDER_METRICS_TOKEN: ${RENDER_METRICS_TOKEN:-}
      RAILWAY_METRICS_HOST: ${RAILWAY_METRICS_HOST:-railway.example.invalid:443}
      RAILWAY_METRICS_TOKEN: ${RAILWAY_METRICS_TOKEN:-}
      CLOUDFLARE_METRICS_HOST: ${CLOUDFLARE_METRICS_HOST:-tunnel.example.invalid:443}
      CLOUDFLARE_METRICS_TOKEN: ${CLOUDFLARE_METRICS_TOKEN:-}
    restart: unless-stopped
